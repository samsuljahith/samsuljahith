# Generates the contribution snake SVGs and pushes them to the `output` branch.
# The README references the raw SVG URLs from that branch.
# Runs daily at midnight UTC and can be triggered manually via workflow_dispatch.

name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:       # allows manual "Run workflow" from the Actions tab

jobs:
  generate:
    name: Generate snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1 — generate both a light and a dark variant of the snake SVG
      - name: Generate snake (light + dark)
        uses: Platane/snk@v3
        with:
          github_user_name: samsuljahith
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2 — force-push the dist/ folder to the `output` branch so the
      # raw GitHub URLs in the README always serve the latest SVGs
      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh contribution snake [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
